name: KirbyAM APWorld

on:
  push:
    branches:
      - main
    tags:
      - "kirbyam-v*"
  pull_request:
    paths:
      - ".github/workflows/kirbyam-apworld.yml"
      - ".github/scripts/kirbyam_release_metadata.py"
      - ".github/scripts/kirbyam_publish_policy.py"
      - "worlds/kirbyam/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apworld:
    runs-on: ubuntu-latest
    outputs:
      apworld_name: ${{ steps.package.outputs.apworld_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_enabled: ${{ steps.meta.outputs.release_enabled }}
      version: ${{ steps.meta.outputs.version }}
      manifest_version: ${{ steps.meta.outputs.manifest_version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show Python version
        run: |
          python --version

      - name: Test publisher policy without release access
        run: python -m unittest discover -s worlds/kirbyam/tools/tests -v

      - name: Prepare release metadata
        id: meta
        run: |
          python .github/scripts/kirbyam_release_metadata.py \
            --github-ref "${GITHUB_REF}" \
            --world-manifest "worlds/kirbyam/archipelago.json" \
            --changelog "worlds/kirbyam/CHANGELOG.md" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Build kirbyam.apworld from source
        run: |
          python worlds/kirbyam/build.py --skip-patch --skip-install --non-interactive
          if [ ! -f worlds/kirbyam/kirbyam.apworld ]; then
            echo "kirbyam.apworld was not created" >&2
            exit 1
          fi
          if [ ! -s worlds/kirbyam/data/base_patch.bsdiff4 ]; then
            echo "Committed data/base_patch.bsdiff4 is missing or empty" >&2
            exit 1
          fi
          ls -lh worlds/kirbyam/kirbyam.apworld worlds/kirbyam/data/base_patch.bsdiff4
          sha256sum worlds/kirbyam/kirbyam.apworld worlds/kirbyam/data/base_patch.bsdiff4

      - name: Stage artifact
        id: package
        shell: bash
        run: |
          mkdir -p dist
          cp worlds/kirbyam/kirbyam.apworld "dist/${{ steps.meta.outputs.apworld_name }}"
          ls -lh dist
          echo "apworld_name=${{ steps.meta.outputs.apworld_name }}" >> "${GITHUB_OUTPUT}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.apworld_name }}
          path: dist/${{ steps.package.outputs.apworld_name }}
          if-no-files-found: error
          retention-days: 14

  release-apworld:
    if: github.repository == 'hasherwi/Archipelago-kirbyam' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/kirbyam-v') && github.ref_protected == true
    environment: kirbyam-release
    runs-on: ubuntu-latest
    needs: build-apworld
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize release from trusted main policy
        id: authorize
        run: python .github/scripts/kirbyam_publish_policy.py

      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.authorize.outputs.apworld_name }}
          path: dist

      - name: Ensure tagged release exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.authorize.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.authorize.outputs.release_name }}
          RELEASE_PRERELEASE: ${{ steps.authorize.outputs.prerelease }}
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; preserving existing body/state."
          else
            release_notes_path="release_notes.md"

            prerelease_flag=()
            if [ "${RELEASE_PRERELEASE}" = "true" ]; then
              prerelease_flag=(--prerelease)
            fi

            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_NAME}" \
              --draft \
              "${prerelease_flag[@]}" \
              --notes-file "${release_notes_path}"
          fi

      - name: Prune non-APWorld assets from tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.authorize.outputs.release_tag }}
          APWORLD_NAME: ${{ steps.authorize.outputs.apworld_name }}
        run: |
          gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets \
            --jq '.assets[].name' | while IFS= read -r asset_name; do
              if [ -n "${asset_name}" ] && [ "${asset_name}" != "${APWORLD_NAME}" ]; then
                echo "Deleting prior release asset: ${asset_name}"
                gh release delete-asset "${RELEASE_TAG}" "${asset_name}" --repo "${GITHUB_REPOSITORY}" --yes
              fi
            done

      - name: Upload APWorld to tagged release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.authorize.outputs.release_tag }}
          APWORLD_NAME: ${{ steps.authorize.outputs.apworld_name }}
        run: |
          gh release upload "${RELEASE_TAG}" "dist/${APWORLD_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Verify release asset publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.authorize.outputs.release_tag }}
          APWORLD_NAME: ${{ steps.authorize.outputs.apworld_name }}
        run: |
          gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets \
            --jq '.assets[].name' | grep -Fx "${APWORLD_NAME}"

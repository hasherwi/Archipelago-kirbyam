name: KirbyAM APWorld

on:
  push:
    branches:
      - main
    tags:
      - "kirbyam-v*"
  pull_request:
    paths:
      - ".github/workflows/kirbyam-apworld.yml"
      - ".github/scripts/kirbyam_release_metadata.py"
      - ".github/scripts/kirbyam_publish_policy.py"
      - "worlds/kirbyam/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apworld:
    runs-on: ubuntu-latest
    outputs:
      apworld_name: ${{ steps.package.outputs.apworld_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_enabled: ${{ steps.meta.outputs.release_enabled }}
      version: ${{ steps.meta.outputs.version }}
      manifest_version: ${{ steps.meta.outputs.manifest_version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show Python version
        run: |
          python --version

      - name: Test publisher policy without release access
        run: |
          python -m unittest discover -s worlds/kirbyam/tools/tests -p test_publish_policy.py -v
          python -m unittest discover -s worlds/kirbyam/tools/tests -p test_release_artifacts.py -v

      - name: Prepare release metadata
        id: meta
        run: |
          python .github/scripts/kirbyam_release_metadata.py \
            --github-ref "${GITHUB_REF}" \
            --world-manifest "worlds/kirbyam/archipelago.json" \
            --changelog "worlds/kirbyam/CHANGELOG.md" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Build kirbyam.apworld from source
        run: |
          python worlds/kirbyam/build.py --skip-patch --skip-install --non-interactive
          if [ ! -f worlds/kirbyam/kirbyam.apworld ]; then
            echo "kirbyam.apworld was not created" >&2
            exit 1
          fi
          if [ ! -s worlds/kirbyam/data/base_patch.bsdiff4 ]; then
            echo "Committed data/base_patch.bsdiff4 is missing or empty" >&2
            exit 1
          fi
          ls -lh worlds/kirbyam/kirbyam.apworld worlds/kirbyam/data/base_patch.bsdiff4
          sha256sum worlds/kirbyam/kirbyam.apworld worlds/kirbyam/data/base_patch.bsdiff4

      - name: Stage artifact
        id: package
        shell: bash
        run: |
          mkdir -p dist
          cp worlds/kirbyam/kirbyam.apworld "dist/${{ steps.meta.outputs.apworld_name }}"
          python worlds/kirbyam/tools/release_artifacts.py record dist
          ls -lh dist
          echo "apworld_name=${{ steps.meta.outputs.apworld_name }}" >> "${GITHUB_OUTPUT}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.apworld_name }}
          path: |
            dist/kirbyam.apworld
            dist/kirbyam.provenance.json
          if-no-files-found: error
          retention-days: 14

  release-apworld:
    if: github.repository == 'hasherwi/Archipelago-kirbyam' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/kirbyam-v') && github.ref_protected == true
    environment: kirbyam-release
    runs-on: ubuntu-latest
    needs: build-apworld
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Authorize release from trusted main policy
        id: authorize
        run: python .github/scripts/kirbyam_publish_policy.py

      - name: Download built artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.authorize.outputs.apworld_name }}
          path: dist

      - name: Verify intended build receipt before attesting
        run: python worlds/kirbyam/tools/release_artifacts.py verify dist

      - name: Attest exact APWorld and provenance receipt
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/kirbyam.apworld
            dist/kirbyam.provenance.json

      - name: Stage attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/kirbyam.attestation.jsonl

      - name: Verify signatures and plan draft-only additions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.authorize.outputs.release_tag }}
        run: |
          for artifact in kirbyam.apworld kirbyam.provenance.json; do
            gh attestation verify "dist/$artifact" --repo "$GITHUB_REPOSITORY" \
              --bundle dist/kirbyam.attestation.jsonl \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/kirbyam-apworld.yml" \
              --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > release-state.json
          python worlds/kirbyam/tools/release_artifacts.py plan dist --state release-state.json > upload-plan.txt

      - name: Add missing draft assets without replacement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.authorize.outputs.release_tag }}
        run: |
          while IFS= read -r asset; do
            # Recheck draft state immediately before each addition; no clobber or deletion.
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > release-state.json
            python worlds/kirbyam/tools/release_artifacts.py plan dist --state release-state.json > current-plan.txt
            grep -Fx "$asset" current-plan.txt
            gh release upload "$RELEASE_TAG" "dist/$asset" --repo "$GITHUB_REPOSITORY"
          done < upload-plan.txt

      - name: Download staged bytes and verify provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.authorize.outputs.release_tag }}
        run: |
          mkdir verified-download
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir verified-download \
            --pattern kirbyam.apworld --pattern kirbyam.provenance.json --pattern kirbyam.attestation.jsonl
          for artifact in kirbyam.apworld kirbyam.provenance.json kirbyam.attestation.jsonl; do
            cmp "dist/$artifact" "verified-download/$artifact"
          done
          python worlds/kirbyam/tools/release_artifacts.py verify verified-download
          for artifact in kirbyam.apworld kirbyam.provenance.json; do
            gh attestation verify "verified-download/$artifact" --repo "$GITHUB_REPOSITORY" \
              --bundle verified-download/kirbyam.attestation.jsonl \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/kirbyam-apworld.yml" \
              --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --deny-self-hosted-runners
          done

name: Native Code Static Analysis

on:
  push:
    branches:
      - main
    paths:
      - '**.c'
      - '**.cc'
      - '**.cpp'
      - '**.cxx'
      - '**.h'
      - '**.hh'
      - '**.hpp'
      - '**.pyx'
      - 'setup.py'
      - 'requirements.txt'
      - '.github/workflows/scan-build.yml'
  pull_request:
    paths:
      - '**.c'
      - '**.cc'
      - '**.cpp'
      - '**.cxx'
      - '**.h'
      - '**.hh'
      - '**.hpp'
      - '**.pyx'
      - 'setup.py'
      - 'requirements.txt'
      - '.github/workflows/scan-build.yml'

permissions: {}

jobs:
  scan-build:
    # Noble provides LLVM 19 in its signed archive. ubuntu-latest may advance
    # to a release without the matching apt.llvm.org repository.
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v6.0.2
      with:
        submodules: recursive
    - name: Install LLVM 19 from Ubuntu packages
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends clang-19 clang-tools-19
        clang-19 --version
        command -v scan-build-19
    - name: Get a recent python
      uses: actions/setup-python@v6.2.0
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        python -m pip install --upgrade pip -r requirements.txt
    - name: scan-build
      run: |
        source venv/bin/activate
        scan-build-19 --use-analyzer "$(command -v clang-19)" --status-bugs -o scan-build-reports -disable-checker deadcode.DeadStores python setup.py build -y
    - name: Store report
      if: failure()
      uses: actions/upload-artifact@v7.0.0
      with:
        name: scan-build-reports
        path: scan-build-reports
        compression-level: 9  # highly compressible
        if-no-files-found: error

name: KirbyAM ROM Patch Smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kirbyam-rom-patch-smoke.yml"
      - "worlds/kirbyam/**"
  pull_request:
    paths:
      - ".github/workflows/kirbyam-rom-patch-smoke.yml"
      - "worlds/kirbyam/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc-arm-none-eabi binutils-arm-none-eabi
          python -m pip --isolated --disable-pip-version-check install --no-index --no-deps --require-hashes -r worlds/kirbyam/tools/security-bootstrap.txt
          python -m pip --isolated --disable-pip-version-check download --only-binary=:all: --no-deps --require-hashes -r worlds/kirbyam/tools/rom-smoke-requirements.txt -d "$RUNNER_TEMP/kirby-wheels"
          python worlds/kirbyam/tools/verify_wheelhouse.py "$RUNNER_TEMP/kirby-wheels" worlds/kirbyam/tools/rom-smoke-wheels.json
          python -m pip --isolated --disable-pip-version-check install --no-index --find-links "$RUNNER_TEMP/kirby-wheels" --only-binary=:all: --no-deps --require-hashes -r worlds/kirbyam/tools/rom-smoke-requirements.txt
          python -m pip check
          python -m unittest discover -s worlds/kirbyam/tools/tests -p test_wheelhouse.py -v

      - name: Create deterministic dummy base ROM for CI smoke
        run: |
          python - <<'PY'
          from pathlib import Path

          ROM_BASE = 0x08000000


          def thumb_bl_bytes(source_offset: int, target_address: int) -> bytes:
              """Encode a Thumb-1 BL from a ROM file offset to an absolute GBA address."""
              source_address = ROM_BASE + source_offset
              displacement = target_address - (source_address + 4)

              if displacement & 1:
                  raise ValueError("Thumb BL target must be halfword aligned")

              # Thumb-1 BL stores a signed 22-bit halfword displacement.
              immediate = (displacement >> 1) & 0x3FFFFF
              first_halfword = 0xF000 | ((immediate >> 11) & 0x7FF)
              second_halfword = 0xF800 | (immediate & 0x7FF)

              return (
                  first_halfword.to_bytes(2, "little")
                  + second_halfword.to_bytes(2, "little")
              )


          rom_path = Path("worlds/kirbyam/kirby_ap_payload/kirby.gba")
          rom_path.parent.mkdir(parents=True, exist_ok=True)
          rom = bytearray(0x1000000)

          # Fixed callsites validated only for their Thumb-BL instruction shape.
          placeholder_bl = bytes.fromhex("00 f0 00 f8")
          for offset in (
              0x001D952,
              0x0000B144,
              0x0000B0CC,
              0x0000B1D0,
              0x0000B264,
              0x00039EEE,
              0x0000AFEC,
              0x00119B98,  # Small-switch effect dispatch used by lever-item decoupling.
          ):
              rom[offset:offset + 4] = placeholder_bl

          # Exact original instructions overwritten by the minor-chest reward-popup hook.
          rom[0x0000B9A4:0x0000B9A8] = bytes.fromhex("D4 6C 20 1C")

          # patch_rom.py requires exactly eight direct calls to the retail
          # boss-already-owned reward function.
          for index in range(8):
              offset = 0x21000 + index * 4
              rom[offset:offset + 4] = thumb_bl_bytes(offset, 0x08088A38)

          # Verified ordinary-enemy r5/type ABI for the Minny exception.
          rom[0x9C6A2:0x9C6AA] = bytes.fromhex("2c 1c 84 34 21 78 30 1c")
          ability_request_offset = 0x9C6AA
          rom[ability_request_offset:ability_request_offset + 4] = thumb_bl_bytes(
              ability_request_offset,
              0x080547C4,
          )

          # Direct statue / scripted transitioningAbility path.
          transition_start_offset = 0x22004
          rom[transition_start_offset:transition_start_offset + 4] = thumb_bl_bytes(
              transition_start_offset,
              0x08054C0C,
          )

          # The starting-color fix validates the two retail single-player calls
          # to sub_080332BC before redirecting them to the payload wrapper.
          for offset in (0x00123EF2, 0x00124022):
              rom[offset:offset + 4] = thumb_bl_bytes(offset, 0x080332BC)

          # Lever initializer and delayed wall-counter grant path.
          initializer = 0x351648 + 0x81 * 0x18 + 0x10
          rom[initializer:initializer + 4] = (0x0800BD4D).to_bytes(4, "little")
          rom[0xB9B0:0xB9B4] = thumb_bl_bytes(0xB9B0, 0x080029F4)
          # Ordinary and native-roulette final callback installers.
          for offset in (0x5C200, 0x5C400):
              rom[offset:offset + 4] = (0x0805C619).to_bytes(4, "little")

          # Exact native HUD callers required by trailing-tile cleanup.
          rom[0x14380A:0x14380E] = thumb_bl_bytes(0x14380A, 0x08019F0C)
          # Exact native treasure-menu owned-paint selection call.
          rom[0x14406C:0x144070] = thumb_bl_bytes(0x14406C, 0x081447E0)
          rom[0x3EB0E:0x3EB14] = thumb_bl_bytes(0x3EB0E, 0x08019F0C) + b"\x06\x30"
          for offset in (0x339B2, 0x33BF2, 0x35A62):
              rom[offset:offset + 4] = thumb_bl_bytes(offset, 0x0803518C)

          # Synthetic native palette hook sentinels; no retail ROM data.
          rom[0xD60820:0xD60824] = (0x08155401).to_bytes(4, "little")
          rom[0x3D21C:0x3D224] = bytes.fromhex("70 b5 04 1c 0d 1c 16 1c")

          # Preserve strict native hub guards in the synthetic smoke input.
          import runpy
          hub_fixture = runpy.run_path("worlds/kirbyam/test/native/hub_transition_fixture.py")
          hub_fixture["populate_hub_transition_fixture"](rom)

          rom_path.write_bytes(rom)
          PY

      - name: Build payload and generate ROM patch
        run: |
          python worlds/kirbyam/build.py --source-type arg --rom "$PWD/worlds/kirbyam/kirby_ap_payload/kirby.gba" --skip-install --non-interactive

      - name: Validate expected outputs exist
        run: |
          test -f worlds/kirbyam/data/base_patch.bsdiff4
          test -f worlds/kirbyam/kirbyam.apworld
          test -f worlds/kirbyam/kirby_ap_payload/payload.bin
          test -f worlds/kirbyam/kirby_ap_payload/color_payload.bin

      - name: Upload KirbyAM patch smoke artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kirbyam-rom-patch-smoke-artifacts
          path: |
            worlds/kirbyam/data/base_patch.bsdiff4
            worlds/kirbyam/kirbyam.apworld
            worlds/kirbyam/kirby_ap_payload/payload.bin
            worlds/kirbyam/kirby_ap_payload/patch_rom.log
          if-no-files-found: error
          retention-days: 14

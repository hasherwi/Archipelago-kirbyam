name: KirbyAM ROM Patch Smoke

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kirbyam-rom-patch-smoke.yml"
      - "worlds/kirbyam/**"
  pull_request:
    paths:
      - ".github/workflows/kirbyam-rom-patch-smoke.yml"
      - "worlds/kirbyam/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc-arm-none-eabi binutils-arm-none-eabi
          python -m pip install --upgrade pip
          python -m pip install bsdiff4

      - name: Create deterministic dummy base ROM for CI smoke
        run: |
          python - <<'PY'
          from pathlib import Path

          ROM_BASE = 0x08000000


          def thumb_bl_bytes(source_offset: int, target_address: int) -> bytes:
              """Encode a Thumb-1 BL from a ROM file offset to an absolute GBA address."""
              source_address = ROM_BASE + source_offset
              displacement = target_address - (source_address + 4)

              if displacement & 1:
                  raise ValueError("Thumb BL target must be halfword aligned")

              # Thumb-1 BL stores a signed 22-bit halfword displacement.
              immediate = (displacement >> 1) & 0x3FFFFF
              first_halfword = 0xF000 | ((immediate >> 11) & 0x7FF)
              second_halfword = 0xF800 | (immediate & 0x7FF)

              return (
                  first_halfword.to_bytes(2, "little")
                  + second_halfword.to_bytes(2, "little")
              )


          rom_path = Path("worlds/kirbyam/kirby_ap_payload/kirby.gba")
          rom_path.parent.mkdir(parents=True, exist_ok=True)
          rom = bytearray(0x200000)

          # Fixed callsites validated only for their Thumb-BL instruction shape.
          placeholder_bl = bytes.fromhex("00 f0 00 f8")
          for offset in (
              0x001D952,
              0x0000B144,
              0x0000B0CC,
              0x0000B1D0,
              0x0000B264,
              0x00039EEE,
              0x0000AFEC,
              0x00119B98,  # Small-switch effect dispatch used by lever-item decoupling.
          ):
              rom[offset:offset + 4] = placeholder_bl

          # patch_rom.py requires exactly eight direct calls to the retail
          # boss-already-owned reward function.
          for index in range(8):
              offset = 0x21000 + index * 4
              rom[offset:offset + 4] = thumb_bl_bytes(offset, 0x08088A38)

          # Ordinary enemy / ability-star request path.
          ability_request_offset = 0x22000
          rom[ability_request_offset:ability_request_offset + 4] = thumb_bl_bytes(
              ability_request_offset,
              0x080547C4,
          )

          # Direct statue / scripted transitioningAbility path.
          transition_start_offset = 0x22004
          rom[transition_start_offset:transition_start_offset + 4] = thumb_bl_bytes(
              transition_start_offset,
              0x08054C0C,
          )

          # The starting-color fix validates the two retail single-player calls
          # to sub_080332BC before redirecting them to the payload wrapper.
          for offset in (0x00123EF2, 0x00124022):
              rom[offset:offset + 4] = thumb_bl_bytes(offset, 0x080332BC)

          rom_path.write_bytes(rom)
          PY

      - name: Build payload and generate ROM patch
        run: |
          python worlds/kirbyam/build.py --source-type arg --rom "$PWD/worlds/kirbyam/kirby_ap_payload/kirby.gba" --skip-install --non-interactive

      - name: Validate expected outputs exist
        run: |
          test -f worlds/kirbyam/data/base_patch.bsdiff4
          test -f worlds/kirbyam/kirbyam.apworld
          test -f worlds/kirbyam/kirby_ap_payload/payload.bin

      - name: Upload KirbyAM patch smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kirbyam-rom-patch-smoke-artifacts
          path: |
            worlds/kirbyam/data/base_patch.bsdiff4
            worlds/kirbyam/kirbyam.apworld
            worlds/kirbyam/kirby_ap_payload/payload.bin
            worlds/kirbyam/kirby_ap_payload/patch_rom.log
          if-no-files-found: error
          retention-days: 14

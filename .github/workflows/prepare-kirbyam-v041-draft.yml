name: Prepare KirbyAM v0.4.1 draft prerelease
on:
  push:
    branches: [codex/draft-kirbyam-v0.4.1]
permissions:
  contents: read
concurrency:
  group: draft-kirbyam-v0.4.1
  cancel-in-progress: false
jobs:
  prepare-draft:
    if: github.ref == 'refs/heads/codex/draft-kirbyam-v0.4.1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fa4926316901dcc4bbc29c5ccf62e6cfd8268fcd
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build audited APWorld from pinned main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'fa4926316901dcc4bbc29c5ccf62e6cfd8268fcd'
          mkdir -p dist
          python .github/scripts/kirbyam_release_metadata.py --github-ref refs/tags/kirbyam-v0.4.1 --world-manifest worlds/kirbyam/archipelago.json --changelog worlds/kirbyam/CHANGELOG.md --release-notes dist/release-notes.md
          python worlds/kirbyam/build.py --skip-patch --skip-install --non-interactive
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,zipfile
          source=Path('worlds/kirbyam');out=Path('dist');out.mkdir(exist_ok=True)
          tracked=set(subprocess.check_output(['git','ls-files','worlds/kirbyam'],text=True).splitlines())
          rows={}
          with zipfile.ZipFile(source/'kirbyam.apworld') as original,zipfile.ZipFile(out/'kirbyam.apworld','w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as final:
           for name in sorted(original.namelist()):
            p=Path('worlds')/name
            assert name.startswith('kirbyam/') and '..' not in Path(name).parts
            assert str(p) in tracked,(name,'untracked')
            assert p.suffix.lower() not in {'.gba','.sav','.srm','.ss0','.o','.elf','.pyc','.apworld','.sqlite3','.apsave'}
            assert not any(x in {'private-roms','save_states','__pycache__','.git'} for x in p.parts)
            content=original.read(name)
            if name=='kirbyam/archipelago.json':
             manifest=json.loads(content);expected=json.loads(p.read_bytes());expected.update(version=7,compatible_version=7)
             assert manifest==expected and manifest['world_version']=='0.4.1'
            else: assert content==p.read_bytes(),name
            rows[name]=hashlib.sha256(content).hexdigest()
            entry=zipfile.ZipInfo(name,(1980,1,1,0,0,0));entry.compress_type=zipfile.ZIP_DEFLATED;entry.external_attr=0o100644<<16
            final.writestr(entry,content,compresslevel=9)
          result={'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'asset':'kirbyam.apworld','sha256':hashlib.sha256((out/'kirbyam.apworld').read_bytes()).hexdigest(),'inventory_sha256':hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(',',':')).encode()).hexdigest(),'entries':len(rows),'patch_sha256':rows['kirbyam/data/base_patch.bsdiff4'],'notes_sha256':hashlib.sha256((out/'release-notes.md').read_bytes()).hexdigest(),'private_files_excluded':True}
          (out/'provenance.json').write_text(json.dumps(result,indent=2)+'\n');print(json.dumps(result,indent=2))
          PY
      - name: Create only an unpublished draft prerelease and attach verified asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          repo='hasherwi/Archipelago-kirbyam';tag='kirbyam-v0.4.1';commit='fa4926316901dcc4bbc29c5ccf62e6cfd8268fcd'
          def api(path,payload=None,missing=False):
           cmd=['gh','api',f'repos/{repo}/{path}']
           if payload is not None:cmd+=['--method','POST','--input','-']
           r=subprocess.run(cmd,input=None if payload is None else json.dumps(payload),text=True,capture_output=True)
           if r.returncode:
            if missing and 'HTTP 404' in r.stderr:return None
            raise RuntimeError(r.stderr)
           return json.loads(r.stdout)
          assert api('branches/main')['commit']['sha']==commit,'main changed: stop and rebuild'
          assert api(f'git/ref/tags/{tag}',missing=True) is None,'tag exists: stop without replacing'
          assert not [r for r in api('releases?per_page=100') if r['tag_name']==tag],'release exists: stop without replacing'
          notes=Path('dist/release-notes.md').read_text()
          proof=json.loads(Path('dist/provenance.json').read_text())
          assert proof['inventory_sha256']=='1e36f737f9199f72a9553c0fc2fba7f3e15333d3932c11cae893adc0a0fdf2d3'
          assert proof['notes_sha256']=='04fa93bcad871637a08e9675a2b3506d8d7a14d9f6f93e683e8c765b42670c79'
          release=api('releases',{'tag_name':tag,'target_commitish':commit,'name':'KirbyAM APWorld v0.4.1','body':notes,'draft':True,'prerelease':True,'make_latest':'false'})
          Path('dist/draft-created.json').write_text(json.dumps(release,indent=2)+'\n')
          assert release['draft'] is True and release['prerelease'] is True
          rid=release['id']
          r=subprocess.run(['gh','api',f'https://uploads.github.com/repos/{repo}/releases/{rid}/assets?name=kirbyam.apworld','--method','POST','--header','Content-Type: application/zip','--input','dist/kirbyam.apworld'],capture_output=True,check=True)
          asset=json.loads(r.stdout)
          with Path('dist/download-verified.apworld').open('wb') as f:
           subprocess.run(['gh','api',f"repos/{repo}/releases/assets/{asset['id']}",'--header','Accept: application/octet-stream'],stdout=f,check=True)
          assert hashlib.sha256(Path('dist/download-verified.apworld').read_bytes()).hexdigest()==proof['sha256']
          release=api(f'releases/{rid}')
          assert release['draft'] is True and release['prerelease'] is True
          assert release['target_commitish']==commit and release['name']=='KirbyAM APWorld v0.4.1'
          assert release['body'].replace('\r\n','\n').rstrip()==notes.rstrip()
          assert len(release['assets'])==1 and release['assets'][0]['name']=='kirbyam.apworld'
          assert api(f'git/ref/tags/{tag}',missing=True) is None,'unexpected tag creation'
          Path('dist/verified-draft.json').write_text(json.dumps(release,indent=2)+'\n')
          print(json.dumps({'url':release['html_url'],'draft':release['draft'],'prerelease':release['prerelease'],'source':commit,'asset':'kirbyam.apworld','sha256':proof['sha256'],'download_verified':True,'tag_absent':True},indent=2))
          PY
      - name: Retain draft-build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kirbyam-v0.4.1-draft-evidence
          path: dist/
          retention-days: 14

name: Remove superseded RC1 prerelease after RC2 verification
on:
  push:
    branches: [codex/publish-kirbyam-v0.4.0-rc2]
permissions:
  contents: read
concurrency:
  group: publish-kirbyam-v0.4.0-rc2
  cancel-in-progress: false
jobs:
  remove-rc1-release:
    if: github.ref == 'refs/heads/codex/publish-kirbyam-v0.4.0-rc2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Verify RC2 again, remove only RC1 release, preserve both tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          repo='hasherwi/Archipelago-kirbyam'
          def api(path, method='GET', missing=False):
              r=subprocess.run(['gh','api',f'repos/{repo}/{path}','--method',method],capture_output=True,text=True)
              if r.returncode:
                  if missing and 'HTTP 404' in r.stderr: return None
                  raise RuntimeError(r.stderr)
              return json.loads(r.stdout) if r.stdout.strip() else None
          tag1='kirbyam-v0.4.0-rc1';tag2='kirbyam-v0.4.0-rc2'
          sha1='2c699568e8ee406769157fb7aa4b5c48a2911b26';sha2='cbf69ef05c6803dab6d973584c93dc9253d8200c'
          expected='e1a9ebf7c2aa3d00f815b07cce206adbdc331a60d06bd6bbeb6ef41426b8514b'
          r2=api(f'releases/tags/{tag2}')
          assert r2['id']==408637041 and r2['name']=='KirbyAM APWorld v0.4.0-rc2'
          assert r2['prerelease'] and not r2['draft'] and r2['target_commitish']==sha2
          notes=r2['body'].replace('\r\n','\n').rstrip('\n')+'\n'
          assert hashlib.sha256(notes.encode()).hexdigest()=='c78a511202dc90a8a5578c69ed71fe88539d27669c80fc2088c8c432d3a11d03'
          assert len(r2['assets'])==1 and r2['assets'][0]['id']==626981665
          data=subprocess.check_output(['gh','api',f'repos/{repo}/releases/assets/626981665','--header','Accept: application/octet-stream'])
          assert hashlib.sha256(data).hexdigest()==expected
          assert api(f'git/ref/tags/{tag1}')['object']['sha']==sha1
          assert api(f'git/ref/tags/{tag2}')['object']['sha']==sha2
          r1=api(f'releases/tags/{tag1}',missing=True)
          if r1 is not None:
              assert r1['id']==408553420 and r1['prerelease'] and r1['tag_name']==tag1
              assert len(r1['assets'])==1 and r1['assets'][0]['digest']=='sha256:9c54397af5edbaba6a0206391c120efb7269b77e2221cb0fa264944e23e48879'
              api('releases/408553420',method='DELETE')
          assert api(f'releases/tags/{tag1}',missing=True) is None
          assert api('releases/408553420',missing=True) is None
          assert api(f'git/ref/tags/{tag1}')['object']['sha']==sha1
          assert api(f'git/ref/tags/{tag2}')['object']['sha']==sha2
          assert api(f'releases/tags/{tag2}')['id']==408637041
          evidence={'rc1_release_deleted':True,'rc1_tag_preserved':sha1,'rc2_commit':sha2,'rc2_asset_sha256':expected,'rc2_available':True}
          Path('deletion-result.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: kirbyam-rc1-release-deletion-evidence
          path: deletion-result.json
          retention-days: 14

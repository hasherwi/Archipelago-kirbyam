name: kirbyam-generation-fuzz

on:
  pull_request:
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of generation attempts"
        required: false
        default: "500"
      jobs:
        description: "Number of parallel fuzzer workers"
        required: false
        default: "4"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generation-fuzz:
    name: KirbyAM generation fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ci-requirements.txt
          python ModuleUpdate.py --yes --force --append "WebHostLib/requirements.txt"
          python Launcher.py --update_settings

      - name: Check Kirby action policy
        run: |
          python worlds/kirbyam/tools/check_action_pins.py
          python -m unittest discover -s worlds/kirbyam/tools/tests -v

      - name: Run KirbyAM generation fuzzer
        env:
          FUZZ_RUNS: ${{ inputs.runs || '500' }}
          FUZZ_JOBS: ${{ inputs.jobs || '4' }}
        run: |
          python tools/run_kirbyam_generation_fuzz.py \
            --runs "$FUZZ_RUNS" \
            --jobs "$FUZZ_JOBS" \
            --timeout 60

      - name: Upload generation-fuzz artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kirbyam-generation-fuzz-${{ github.run_id }}
          path: fuzz_output/**
          if-no-files-found: warn
          retention-days: 14
